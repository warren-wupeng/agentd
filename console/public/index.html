<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agentd console</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">a</div>
      <div class="brand-text">
        <div class="brand-name">agentd</div>
        <div class="brand-sub">managed agents</div>
      </div>
    </div>
    <nav class="nav" id="nav">
      <a href="#/overview" data-route="/overview">
        <svg viewBox="0 0 16 16"><rect x="1.5" y="1.5" width="5.5" height="5.5" rx="1.2"/><rect x="9" y="1.5" width="5.5" height="5.5" rx="1.2"/><rect x="1.5" y="9" width="5.5" height="5.5" rx="1.2"/><rect x="9" y="9" width="5.5" height="5.5" rx="1.2"/></svg>
        概览
      </a>
      <a href="#/agents" data-route="/agents">
        <svg viewBox="0 0 16 16"><rect x="2.5" y="4" width="11" height="8.5" rx="2"/><circle cx="6" cy="8" r="1"/><circle cx="10" cy="8" r="1"/><path d="M8 4V1.8"/><circle cx="8" cy="1.5" r="0.9"/></svg>
        Agents
      </a>
      <a href="#/sessions" data-route="/sessions">
        <svg viewBox="0 0 16 16"><path d="M2.5 3.5h11a1.5 1.5 0 0 1 1.5 1.5v5a1.5 1.5 0 0 1-1.5 1.5H8l-3 3v-3H2.5A1.5 1.5 0 0 1 1 10V5a1.5 1.5 0 0 1 1.5-1.5z"/></svg>

        Workflows
      </a>
    </nav>
    <div class="sidebar-foot">
      <div class="conn" id="conn">
        <span class="dot" id="conn-dot"></span>
        <span id="conn-text">连接中…</span>
      </div>
      <div class="foot-meta">agentd · pre-alpha</div>
    </div>
  </aside>
  <main class="main" id="main"></main>
</div>

<div class="modal-root" id="modal-root"></div>
<div class="toast-root" id="toast-root"></div>

<script src="/app.js"></script>
</body>
</html>
