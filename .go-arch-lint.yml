# go-arch-lint: enforces the internal/ layering from AGENTS.md (Practice 3 —
# boundaries enforced mechanically, not by convention).
# Schema v3: mayDependOn = project components, canUse = vendors (unused —
# depOnAnyVendor covers third-party imports globally).
version: 3

allow:
  depOnAnyVendor: true

components:
  cmd:        { in: cmd/** }
  api:        { in: internal/api/** }
  loop:       { in: internal/loop/** }
  model:      { in: internal/model/** }
  tools:      { in: internal/tools/** }
  sandbox:    { in: internal/sandbox/** }
  policy:     { in: internal/policy/** }
  hub:        { in: internal/hub/** }
  harness:    { in: internal/harness/** }
  vault:      { in: internal/vault/** }
  mcp:        { in: internal/mcp/** }
  store:      { in: internal/store/** }
  config:     { in: internal/config/** }
  agentderr:  { in: internal/agentderr/** }
  migrations: { in: migrations/** }
  testutil:   { in: internal/testutil/** }

# agentderr is the error type crossing all layers (G5) — everyone may use it.
commonComponents:
  - agentderr

# Components absent from deps may import nothing but commonComponents.
deps:
  cmd:      { mayDependOn: [api, store, config, loop, model, tools, sandbox, policy, hub, harness, vault, mcp] }
  api:      { mayDependOn: [store, loop, hub, harness, vault, mcp] } # wiring-level seams: loop Runner, harness Dispatcher (deepScan sees the cmd wiring)
  loop:     { mayDependOn: [store, model, tools, sandbox, policy] }
  hub:      { mayDependOn: [model] } # Delta type only — fan-out carries model fragments
  harness:  { mayDependOn: [store, model, policy, loop] } # native wraps loop; adapters normalize into store events
  vault:    { anyVendorDeps: true } # G2: secrets live ONLY here — zero project deps, minimal surface
  mcp:      { mayDependOn: [vault, agentderr] } # injects vault credentials into outbound requests
  tools:    { mayDependOn: [sandbox, policy, mcp] } # mcp: wiring-level — WithMCP(mcpSvc) in cmd; imports stay one-way via MCPCaller interface
  store:    { mayDependOn: [migrations] }
  testutil: { mayDependOn: [store] }

excludeFiles:
  - "^.*_test\\.go$"
