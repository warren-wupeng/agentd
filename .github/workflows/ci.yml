name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - run: go vet ./...
      # Cache the embedded-postgres binary cache: first test run downloads
      # PG from repo1.maven.org, which occasionally rate-limits CI egress.
      - uses: actions/cache@v4
        with:
          path: ~/.embedded-postgres-go
          key: embedded-pg-v16-${{ runner.os }}
      # Tests boot their own embedded Postgres — no service container.
      # AGENTD_DOCKER=1 enables the sandbox escape suite's docker tier
      # (ubuntu runners ship a working daemon).
      - run: go test ./...
        env:
          AGENTD_DOCKER: "1"
      # SDKs are dependency-free; syntax checks are the whole CI story.
      - run: node --check sdk/typescript/agentd.js
      - run: python -m py_compile sdk/python/agentd.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      # Installed from source: prebuilt golangci-lint binaries are compiled
      # with an older Go and refuse a go1.25 target.
      - run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8
      - run: golangci-lint run ./...
      - run: go install github.com/fe3dback/go-arch-lint@v1.18.0
      - run: go-arch-lint check
